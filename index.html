<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Showdown — Rock Paper Scissors</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --felt-deep:#0E3B2E;
    --felt-dark:#092720;
    --void:#080B09;
    --gold:#D4AF37;
    --gold-dim:#8C7126;
    --ivory:#F2E8D5;
    --loss:#B23A2E;
    --tie:#2E8B7A;
    --win:#3E9B5C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #16493A 0%, var(--void) 70%);
    font-family:'Inter', sans-serif;
    color:var(--ivory);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .table{
    width:100%;
    max-width:640px;
    background:radial-gradient(ellipse at 50% 30%, var(--felt-deep) 0%, var(--felt-dark) 100%);
    border:10px solid #1a1a17;
    border-radius:28px;
    box-shadow:
      inset 0 0 0 2px rgba(212,175,55,0.25),
      inset 0 0 60px rgba(0,0,0,0.5),
      0 20px 60px rgba(0,0,0,0.6);
    padding:28px 28px 32px;
    position:relative;
    overflow:hidden;
  }
  .table::before{
    content:'';
    position:absolute; inset:0;
    background:repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(255,255,255,0.012) 41px);
    pointer-events:none;
  }

  .hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
    position:relative;
    z-index:1;
  }
  .brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:2px;
    font-size:15px;
    color:var(--gold);
    text-transform:uppercase;
  }
  .brand span{ color:var(--ivory); font-weight:500; opacity:0.6; letter-spacing:1px;}

  .stats{
    display:flex;
    gap:18px;
  }
  .stat{ text-align:right; }
  .stat .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:rgba(242,232,213,0.5);
    margin-bottom:2px;
  }
  .stat .value{
    font-family:'Oswald', sans-serif;
    font-size:22px;
    font-weight:600;
    color:var(--gold);
    transition:transform 0.15s ease;
  }
  .stat .value.pulse{ transform:scale(1.15); }
  #streakStat .value{ color:var(--ivory); }

  .arena{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    position:relative;
    z-index:1;
    margin-bottom:26px;
    min-height:150px;
  }
  .fighter{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .fighter .tag{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:rgba(242,232,213,0.55);
  }
  .hand-display{
    width:96px;
    height:96px;
    border-radius:50%;
    background:rgba(0,0,0,0.25);
    border:2px solid rgba(212,175,55,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), border-color 0.25s, background 0.25s;
  }
  .hand-display.shake{ animation:shake 0.5s ease-in-out infinite; }
  .hand-display.reveal-win{ border-color:var(--win); background:rgba(62,155,92,0.18); transform:scale(1.08); }
  .hand-display.reveal-lose{ border-color:var(--loss); background:rgba(178,58,46,0.18); }
  .hand-display.reveal-tie{ border-color:var(--tie); background:rgba(46,139,122,0.18); }

  @keyframes shake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    25%{ transform:translateX(-3px) rotate(-6deg); }
    75%{ transform:translateX(3px) rotate(6deg); }
  }

  .vs{
    font-family:'Oswald', sans-serif;
    font-size:14px;
    color:var(--gold-dim);
    letter-spacing:2px;
    padding-top:20px;
  }

  .verdict{
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:1px;
    min-height:30px;
    margin-bottom:18px;
    position:relative; z-index:1;
    color:var(--ivory);
  }
  .verdict.win{ color:var(--win); }
  .verdict.lose{ color:var(--loss); }
  .verdict.tie{ color:var(--tie); }

  .betrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:22px;
    position:relative; z-index:1;
  }
  .betrow .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:rgba(242,232,213,0.5);
    margin-right:4px;
  }
  .chip{
    width:46px; height:46px;
    border-radius:50%;
    border:2px dashed rgba(242,232,213,0.4);
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.15), transparent 60%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:12px;
    cursor:pointer;
    transition:transform 0.15s ease, border-color 0.15s ease;
    color:var(--ivory);
  }
  .chip:hover{ transform:translateY(-3px); }
  .chip.active{
    border:2px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, rgba(212,175,55,0.4), rgba(212,175,55,0.08) 60%);
    color:var(--gold);
    transform:translateY(-4px);
  }
  .chip[data-v="10"]{ box-shadow:0 0 0 1px rgba(255,255,255,0.05) inset; }
  .chip[data-v="25"]{ border-color:rgba(46,139,122,0.5); }
  .chip[data-v="25"].active{ border-color:var(--tie); color:var(--tie); }
  .chip[data-v="50"]{ border-color:rgba(178,58,46,0.5); }
  .chip[data-v="50"].active{ border-color:var(--loss); color:var(--loss); }
  .chip[data-v="all"]{ border-color:rgba(212,175,55,0.5); font-size:10px; }

  .moves{
    display:flex;
    gap:14px;
    justify-content:center;
    position:relative; z-index:1;
  }
  .move-btn{
    width:78px; height:78px;
    border-radius:50%;
    background:linear-gradient(145deg, #123B2F, #0A2620);
    border:2px solid rgba(212,175,55,0.35);
    color:var(--ivory);
    font-size:32px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .move-btn:hover:not(:disabled){
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 6px 16px rgba(212,175,55,0.2);
  }
  .move-btn:active:not(:disabled){ transform:translateY(-1px) scale(0.96); }
  .move-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  .footer-msg{
    text-align:center;
    font-size:12px;
    color:rgba(242,232,213,0.4);
    margin-top:18px;
    position:relative; z-index:1;
  }

  .reset-link{
    display:block;
    text-align:center;
    margin-top:10px;
    font-size:11px;
    color:rgba(212,175,55,0.6);
    cursor:pointer;
    text-decoration:underline;
    position:relative; z-index:1;
  }

  .brokebox{
    text-align:center;
    padding:20px;
    display:none;
    position:relative; z-index:1;
  }
  .brokebox.show{ display:block; }
  .brokebox h2{ font-family:'Oswald',sans-serif; color:var(--loss); margin-bottom:8px; letter-spacing:1px;}
  .brokebox p{ font-size:13px; color:rgba(242,232,213,0.6); margin-bottom:16px; }
  .brokebox button{
    background:var(--gold);
    border:none;
    color:#1a1200;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    padding:10px 24px;
    border-radius:6px;
    cursor:pointer;
    letter-spacing:1px;
  }

  @media (max-width:420px){
    .hand-display{ width:76px; height:76px; font-size:38px; }
    .move-btn{ width:64px; height:64px; font-size:26px; }
    .table{ padding:20px 16px 26px; }
    .stats{ gap:12px; }
  }
</style>
</head>
<body>

<div class="table">
  <div class="hud">
    <div class="brand">Showdown <span>· RPS Table</span></div>
    <div class="stats">
      <div class="stat" id="streakStat">
        <div class="label">Streak</div>
        <div class="value">0</div>
      </div>
      <div class="stat" id="chipStat">
        <div class="label">Chips</div>
        <div class="value">500</div>
      </div>
    </div>
  </div>

  <div class="arena">
    <div class="fighter">
      <div class="tag">You</div>
      <div class="hand-display" id="playerHand">?</div>
    </div>
    <div class="vs">VS</div>
    <div class="fighter">
      <div class="tag">The House</div>
      <div class="hand-display" id="aiHand">?</div>
    </div>
  </div>

  <div class="verdict" id="verdict">Place your bet, then make your move.</div>

  <div class="betrow" id="betRow">
    <span class="label">Bet</span>
    <div class="chip active" data-v="10">10</div>
    <div class="chip" data-v="25">25</div>
    <div class="chip" data-v="50">50</div>
    <div class="chip" data-v="all">ALL IN</div>
  </div>

  <div class="moves" id="moves">
    <button class="move-btn" data-move="rock" title="Rock">✊</button>
    <button class="move-btn" data-move="paper" title="Paper">✋</button>
    <button class="move-btn" data-move="scissors" title="Scissors">✌️</button>
  </div>

  <div class="brokebox" id="brokeBox">
    <h2>You're tapped out</h2>
    <p>The house always resets the table eventually.</p>
    <button id="rebuyBtn">Rebuy — 500 chips</button>
  </div>

  <div class="footer-msg">Virtual chips only — for fun, no real money involved.</div>
  <div class="reset-link" id="resetLink">reset table</div>
</div>

<script>
(function(){
  const HANDS = { rock:'✊', paper:'✋', scissors:'✌️' };
  const BEATS = { rock:'scissors', paper:'rock', scissors:'paper' };

  const state = {
    chips: 500,
    streak: 0,
    bet: 10,
    locked: false
  };

  const chipStat = document.querySelector('#chipStat .value');
  const streakStat = document.querySelector('#streakStat .value');
  const verdict = document.getElementById('verdict');
  const playerHand = document.getElementById('playerHand');
  const aiHand = document.getElementById('aiHand');
  const moveBtns = document.querySelectorAll('.move-btn');
  const chipBtns = document.querySelectorAll('.chip');
  const brokeBox = document.getElementById('brokeBox');
  const betRow = document.getElementById('betRow');
  const moves = document.getElementById('moves');

  function pulse(el){
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }

  function render(){
    chipStat.textContent = state.chips;
    streakStat.textContent = state.streak;
  }

  function currentBetValue(){
    if(state.bet === 'all') return state.chips;
    return Math.min(state.bet, state.chips);
  }

  chipBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.locked) return;
      chipBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const v = btn.dataset.v;
      state.bet = v === 'all' ? 'all' : parseInt(v,10);
    });
  });

  function streakBonus(streak){
    if(streak > 0 && streak % 3 === 0) return 15;
    return 0;
  }

  function playRound(playerMove){
    if(state.locked || state.chips <= 0) return;
    const bet = currentBetValue();
    if(bet <= 0) return;

    state.locked = true;
    moveBtns.forEach(b=>b.disabled = true);

    playerHand.textContent = HANDS[playerMove];
    aiHand.textContent = '?';
    aiHand.classList.add('shake');
    verdict.className = 'verdict';
    verdict.textContent = 'Dealing...';

    setTimeout(()=>{
      const moveKeys = Object.keys(HANDS);
      const aiMove = moveKeys[Math.floor(Math.random()*3)];
      aiHand.classList.remove('shake');
      aiHand.textContent = HANDS[aiMove];

      let outcome;
      if(playerMove === aiMove){
        outcome = 'tie';
      } else if(BEATS[playerMove] === aiMove){
        outcome = 'win';
      } else {
        outcome = 'lose';
      }

      playerHand.classList.remove('reveal-win','reveal-lose','reveal-tie');
      aiHand.classList.remove('reveal-win','reveal-lose','reveal-tie');

      if(outcome === 'win'){
        const bonus = streakBonus(state.streak + 1);
        state.chips += bet + bonus;
        state.streak += 1;
        playerHand.classList.add('reveal-win');
        aiHand.classList.add('reveal-lose');
        verdict.classList.add('win');
        verdict.textContent = bonus
          ? `You win! +${bet} chips, streak bonus +${bonus}`
          : `You win! +${bet} chips`;
      } else if(outcome === 'lose'){
        state.chips -= bet;
        state.streak = 0;
        playerHand.classList.add('reveal-lose');
        aiHand.classList.add('reveal-win');
        verdict.classList.add('lose');
        verdict.textContent = `House wins. -${bet} chips`;
      } else {
        playerHand.classList.add('reveal-tie');
        aiHand.classList.add('reveal-tie');
        verdict.classList.add('tie');
        verdict.textContent = 'Push — bet returned';
      }

      pulse(chipStat);
      pulse(streakStat);
      render();

      state.locked = false;
      moveBtns.forEach(b=>b.disabled = false);

      if(state.chips <= 0){
        moveBtns.forEach(b=>b.disabled = true);
        betRow.style.display = 'none';
        moves.style.display = 'none';
        brokeBox.classList.add('show');
        verdict.textContent = 'Table closed.';
      }
    }, 550);
  }

  moveBtns.forEach(btn=>{
    btn.addEventListener('click', ()=> playRound(btn.dataset.move));
  });

  document.getElementById('rebuyBtn').addEventListener('click', ()=>{
    state.chips = 500;
    state.streak = 0;
    brokeBox.classList.remove('show');
    betRow.style.display = 'flex';
    moves.style.display = 'flex';
    moveBtns.forEach(b=>b.disabled = false);
    verdict.className = 'verdict';
    verdict.textContent = 'Back in it. Place your bet.';
    playerHand.textContent = '?';
    aiHand.textContent = '?';
    playerHand.classList.remove('reveal-win','reveal-lose','reveal-tie');
    aiHand.classList.remove('reveal-win','reveal-lose','reveal-tie');
    render();
  });

  document.getElementById('resetLink').addEventListener('click', ()=>{
    state.chips = 500;
    state.streak = 0;
    state.bet = 10;
    state.locked = false;
    chipBtns.forEach(b=>b.classList.remove('active'));
    chipBtns[0].classList.add('active');
    brokeBox.classList.remove('show');
    betRow.style.display = 'flex';
    moves.style.display = 'flex';
    moveBtns.forEach(b=>b.disabled = false);
    verdict.className = 'verdict';
    verdict.textContent = 'Place your bet, then make your move.';
    playerHand.textContent = '?';
    aiHand.textContent = '?';
    playerHand.classList.remove('reveal-win','reveal-lose','reveal-tie');
    aiHand.classList.remove('reveal-win','reveal-lose','reveal-tie');
    render();
  });

  render();
})();
</script>

</body>
</html>
